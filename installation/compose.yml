name: 02-bookmarks

services:
  pocketbase:
    image: ghcr.io/zawias-pro/02-bookmarks-pocketbase:${BOOKMARKS_VERSION:?Set BOOKMARKS_VERSION to a release tag, for example 1.2.3}
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ${BOOKMARKS_DATA_DIR:-../pb_data}:/pb/pb_data:Z
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/zawias-pro/02-bookmarks-frontend:${BOOKMARKS_VERSION:?Set BOOKMARKS_VERSION to a release tag, for example 1.2.3}
    depends_on:
      pocketbase:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
