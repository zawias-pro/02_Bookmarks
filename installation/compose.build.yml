# Optional override for building the production images locally instead of
# pulling them from GHCR:
#
#   BOOKMARKS_VERSION=dev podman-compose -f compose.yml -f compose.build.yml up -d --build
#
# BOOKMARKS_VERSION is required by compose.yml; any value works for local builds.
# The built images use that tag, so Caddy and the rest of the production setup
# do not change.
services:
  pocketbase:
    build:
      context: ..
      dockerfile: installation/pocketbase/Containerfile

  frontend:
    build:
      context: ..
      dockerfile: installation/frontend/Containerfile
